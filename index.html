  <!-- 3. Google Analytics gtag.js (pages publiques uniquement) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CD3VW4QM4Z"></script>
  <script>
    gtag('js', new Date());
    // Pages publiques autorisees pour le tracking GA
    // ⚠️ Une page absente de cette liste n'envoie AUCUN page_view. Deux consequences
    // qui ont ete corrigees le 30/07/2026 :
    //  - /return et /welcome-founder n'y etaient pas : aucune conversion Sales
    //    n'etait mesurable. L'evenement cle GA4 "essai_gratuit" se declenche sur
    //    un page_view dont l'URL contient /return — il lui faut donc ces pages.
    //  - le contenu editorial (glossaire, ressources, guides…) n'y etait pas non
    //    plus : le blog ne produisait aucune donnee d'audience.
    var GA_PUBLIC = ['/', '/landing', '/sales', '/business', '/sign', '/tarifs',
      '/fonctionnalites', '/comparatifs', '/glossaire', '/ressources', '/guides',
      '/integrations', '/cas-usage', '/clients',
      '/login', '/register', '/checkout', '/return', '/welcome-founder',
      '/mentions-legales', '/cgu', '/cgv',
      '/confidentialite', '/business/login', '/business/checkout', '/business/return',
      '/business/politique-utilisation', '/business/register'];
    var GA_PUBLIC_PREFIXES = ['/fonctionnalites/', '/comparatifs/', '/glossaire/',
      '/ressources/', '/guides/', '/integrations/', '/cas-usage/', '/clients/',
      '/capture/', '/book/'];
    function isPublicPage(p) {
      if (GA_PUBLIC.indexOf(p) !== -1) return true;
      for (var i = 0; i < GA_PUBLIC_PREFIXES.length; i++) {
        if (p.indexOf(GA_PUBLIC_PREFIXES[i]) === 0) return true;
      }
      return false;
    }
    if (isPublicPage(window.location.pathname)) {
      gtag('config', 'G-CD3VW4QM4Z', { send_page_view: true });
    } else {
      gtag('config', 'G-CD3VW4QM4Z', { send_page_view: false });
    }
    // SPA: tracker les navigations vers les pages publiques
    var _origPush = history.pushState;
    history.pushState = function() {
      _origPush.apply(this, arguments);
      if (isPublicPage(window.location.pathname)) {
        gtag('event', 'page_view', { page_path: window.location.pathname });
      }
    };
    window.addEventListener('popstate', function() {
      if (isPublicPage(window.location.pathname)) {
        gtag('event', 'page_view', { page_path: window.location.pathname });
      }
    });
  </script>

  <!-- Custom Tracking Script (deferred to avoid blocking render) -->
  <script>
    (function () {
      var d = "closeos.fr";
      var u = "https://yydewzqxvteemubkdmrh.supabase.co/functions/v1/track";
      var s = sessionStorage.getItem("_tk_sid") || Math.random().toString(36).slice(2);
      sessionStorage.setItem("_tk_sid", s);
      var cc = "";
      fetch("https://get.geojs.io/v1/ip/country.json").then(function (r) { return r.json(); }).then(function (d) { cc = d.country || ""; }).catch(function () { });
      function send(data) {
        if (cc) data.country = cc;
        var b = JSON.stringify(data);
        if (navigator.sendBeacon) { navigator.sendBeacon(u, new Blob([b], { type: "text/plain" })); }
        else { fetch(u, { method: "POST", headers: { "Content-Type": "text/plain" }, body: b, keepalive: true }).catch(function () { }); }
      }
      function t() {
        var q = new URLSearchParams(location.search);
        send({
          domain: d, path: location.pathname, referrer: document.referrer,
          screen_width: screen.width, session_id: s,
          utm_source: q.get("utm_source") || "", utm_medium: q.get("utm_medium") || "", utm_campaign: q.get("utm_campaign") || ""
        });
      }
      if (document.readyState === "complete") { t(); } else { window.addEventListener("load", t); }
      var p = history.pushState;
      history.pushState = function () { p.apply(history, arguments); t(); };
      window.addEventListener("popstate", t);
      document.addEventListener("click", function (e) {
        var el = e.target.closest("button,a,[role=button],[data-track]");
        if (!el) return;
        var txt = (el.innerText || "").trim().slice(0, 80);
        send({
          domain: d, path: location.pathname, session_id: s, type: "event",
          event_name: "click", element_tag: el.tagName.toLowerCase(), element_text: txt
        });
      }, true);
    })();
  </script>
